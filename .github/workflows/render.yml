name: Render WarStory
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan proyek
        run: |
          unzip -o warstory-project.zip
          unzip -o voiceover.zip -d proj/public/audio
          ls -la proj proj/public/audio/voiceover | head -30

      - name: Library untuk Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2

      - name: Install
        working-directory: proj
        run: npm install

      - name: Render
        working-directory: proj
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: warstory-video
          path: proj/out/video.mp4
